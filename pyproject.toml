[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sysrev-meta-analysis"
version = "0.1.0"
description = "PRISMA 2020-compliant, zero-fabrication, human-in-the-loop systematic review and meta-analysis agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "SQLAlchemy>=2.0.30,<3",
    "httpx>=0.27,<1",
    "rapidfuzz>=3.9,<4",
    "numpy>=1.26",
    "scipy>=1.13",
    "lxml>=5.2",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pdfplumber>=0.11",
    "pypdf>=4.2",
]

[project.optional-dependencies]
stats = [
    "matplotlib>=3.9",  # forest plots (src.stats_engine.report)
]
r = ["rpy2>=3.5"]
ui = [
    "streamlit>=1.36",
    "keyring>=24",  # optional OS credential store (Windows Credential Manager, Keychain)
]
orchestration = ["langgraph>=0.2"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
    "lxml-stubs>=0.5",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
"src.llm" = ["model_catalogue.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: performs real network calls against public literature APIs (opt-in: pytest -m live)",
]
filterwarnings = ["error::pydantic.warnings.PydanticDeprecatedSince20"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF", "ASYNC", "PT", "C4", "PIE", "RET"]
ignore = ["RUF001", "RUF002", "RUF003"]  # unicode (e.g. ², τ, ·) is intentional in scientific text

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802", "PT018"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
packages = ["src"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["rapidfuzz.*", "scipy.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
